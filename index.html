<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Learn Modern Standard Arabic — script, vocabulary, and sentence-building — across 100 free, self-paced levels in your browser."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Applies the saved theme before first paint, so nobody using dark mode
         sees a flash of the light theme while the app loads. Mirrors
         resolveTheme() and SETTINGS_STORAGE_KEY in src/lib/settings.ts. -->
    <script>
      (function () {
        var theme = "system";
        try {
          theme = JSON.parse(localStorage.getItem("arabic-tutor:settings") || "{}").theme || theme;
        } catch (e) {}
        var dark =
          theme === "dark" ||
          (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>

    <!-- sizes="32x32", not "any": with "any", Chrome downloads the .ico as
         well as the SVG. The .ico is a fallback for clients without SVG icons. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (Slack, WhatsApp, iMessage, X, LinkedIn). Crawlers need
         absolute URLs, so these point at the production deployment. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arabic Tutor" />
    <meta property="og:url" content="https://arabic-tutor-ssd.vercel.app/" />
    <meta property="og:title" content="Arabic Tutor — learn Modern Standard Arabic" />
    <meta
      property="og:description"
      content="Script, vocabulary, and sentence-building across 100 free, self-paced levels in your browser."
    />
    <!-- JPEG, not PNG: 62 KB against 426 KB, and WhatsApp drops preview images
         over about 300 KB. -->
    <meta property="og:image" content="https://arabic-tutor-ssd.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Arabic Tutor logo, the letter ع on a teal tile, beside the title Arabic Tutor."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Arabic Tutor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
